plugins {
    id 'com.android.application'
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def cloudinaryProps = new Properties()
def cloudinaryConfigFile = rootProject.file('cloudinary.properties')
if (cloudinaryConfigFile.exists()) {
    cloudinaryConfigFile.withInputStream { stream ->
        cloudinaryProps.load(stream)
    }
}

def escapeBuildConfigString = { value ->
    (value ?: "").replace("\\", "\\\\").replace("\"", "\\\"")
}

android {
    namespace 'com.droid.remoteaccess'
    compileSdk 35

    defaultConfig {
        applicationId "com.droid.remoteaccess"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
        buildConfigField "String", "CLOUDINARY_CLOUD_NAME", "\"${escapeBuildConfigString(cloudinaryProps.getProperty('cloudinary.cloudName', ''))}\""
        buildConfigField "String", "CLOUDINARY_UPLOAD_PRESET", "\"${escapeBuildConfigString(cloudinaryProps.getProperty('cloudinary.uploadPreset', ''))}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    implementation 'com.google.firebase:firebase-database'
}
