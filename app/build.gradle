plugins {
    id 'com.android.application'
}

android {
    namespace 'com.droid.remoteaccess'
    compileSdk 35

    def gcmApiKey = providers.gradleProperty("GCM_API_KEY").orElse("").get()
    def gcmSenderId = providers.gradleProperty("GCM_SENDER_ID").orElse("").get()
    def escapedGcmApiKey = gcmApiKey.replace("\\", "\\\\").replace("\"", "\\\"")
    def escapedGcmSenderId = gcmSenderId.replace("\\", "\\\\").replace("\"", "\\\"")

    defaultConfig {
        applicationId "com.droid.remoteaccess"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.0.1"
        buildConfigField "String", "GCM_API_KEY", "\"${escapedGcmApiKey}\""
        buildConfigField "String", "GCM_SENDER_ID", "\"${escapedGcmSenderId}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.gms:play-services-gcm:17.0.0'
    implementation 'com.google.android.gms:play-services-drive:17.0.0'
    implementation 'org.apache.commons:commons-io:1.3.2'
}
